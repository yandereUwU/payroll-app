<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<h2>Личный кабинет сотрудника</h2>
<button onclick="goBack()">Назад</button>

<div class="container">
  <h3>Мои данные</h3>
  <div id="employeeInfo"></div>
</div>

<div class="container">
  <h3>Мои начисления</h3>
  <label>Период</label>
  <select id="yearSelect"></select>
  <select id="monthSelect"></select>
  <button onclick="loadMyPayroll()">Показать</button>
  
  <table id="payrollTable">
    <thead>
      <tr>
        <th>Дата</th>
        <th>Период</th>
        <th>Дни</th>
        <th>Премия</th>
        <th>Налог</th>
        <th>К выплате</th>
      </tr>
    </thead>
    <tbody id="payrollBody"></tbody>
  </table>
</div>

<script src="auth.js"></script>
<script>
const db = require('../database');

checkAccess(['employee']);

function goBack() {
  location.href = 'dashboard.html';
}

// Заполнение выбора периода
function initPeriodSelects() {
  const yearSelect = document.getElementById('yearSelect');
  const currentYear = new Date().getFullYear();
  for (let y = currentYear - 2; y <= currentYear; y++) {
    yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
  }
  yearSelect.value = currentYear;
  
  const monthSelect = document.getElementById('monthSelect');
  const months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 
                   'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  for (let i = 0; i < months.length; i++) {
    monthSelect.innerHTML += `<option value="${i+1}">${months[i]}</option>`;
  }
  monthSelect.value = new Date().getMonth() + 1;
}

// Загрузка данных сотрудника
async function loadEmployeeInfo() {
  const userId = localStorage.getItem('userId');
  const emp = await db.getEmployeeByUserId(userId);
  
  const infoDiv = document.getElementById('employeeInfo');
  if (!emp) {
    infoDiv.innerHTML = '<p>Вы не привязаны к сотруднику</p>';
    return;
  }
  
  infoDiv.innerHTML = `
    <div class="card">
      <p><b>ФИО:</b> ${emp.full_name}</p>
      <p><b>Должность:</b> ${emp.position || '-'}</p>
      <p><b>Ставка:</b> ${emp.rate} ₽ / месяц</p>
    </div>
  `;
}

// Загрузка начислений сотрудника
async function loadMyPayroll() {
  const userId = localStorage.getItem('userId');
  const year = document.getElementById('yearSelect').value;
  const month = document.getElementById('monthSelect').value;
  
  const payrollData = await db.getMyPayroll(userId);
  
  // Фильтрация по году и месяцу
  const filtered = payrollData.filter(p => {
    if (!p.year || !p.month) return false;
    return p.year == year && p.month == month;
  });
  
  const tbody = document.getElementById('payrollBody');
  tbody.innerHTML = '';
  
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6">Нет начислений за выбранный период</td></tr>';
    return;
  }
  
  filtered.forEach(p => {
    const period = `${p.year}-${String(p.month).padStart(2,'0')}`;
    tbody.innerHTML += `
      <tr>
        <td>${new Date(p.date).toLocaleDateString()}</td>
        <td>${period}</td>
        <td>${p.days}</td>
        <td>${p.bonus}</td>
        <td>${p.tax}</td>
        <td><b>${p.total}</b></td>
      </tr>
    `;
  });
}

// Обновление главного меню для ролей (добавить ссылку на manager.html)
function updateDashboardLink() {
  const role = localStorage.getItem('userRole');
  if (role === 'manager') {
    // В dashboard.html уже есть кнопка "Отчёты", но она ведёт на reports.html
    // Для руководителя лучше вести на manager.html
    // Это можно поправить в dashboard.html отдельно
  }
}

window.onload = async () => {
  initPeriodSelects();
  await loadEmployeeInfo();
  await loadMyPayroll();
};
</script>

</body>
</html>
